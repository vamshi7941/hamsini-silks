<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Redirect 404 to index.html for SPA routing
      const path = window.location.pathname.split('/').slice(1).join('/');
      if (path && !path.includes('.')) {
        window.location.href = '/index.html?redirect=' + path;
      }
    </script>
  </head>
  <body></body>
</html>
